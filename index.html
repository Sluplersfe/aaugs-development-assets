<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aaugs-development-assets</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .asset-list {
            margin-top: 20px;
        }
        .asset-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #eee;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .asset-item img {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
            margin-right: 15px;
            border: 1px solid #ddd;
        }
        .asset-details {
            flex-grow: 1;
        }
        .asset-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .asset-size {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .asset-type {
            display: inline-block;
            padding: 2px 8px;
            background-color: #3498db;
            color: white;
            border-radius: 3px;
            font-size: 0.8em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>aaugs-development-assets</h1>
    <p>Repository for development assets</p>
    
    <div class="asset-list">
        <div class="asset-item">
            <img src="cookie.png" alt="Cookie">
            <div class="asset-details">
                <div class="asset-name">cookie.png</div>
                <div class="asset-size">1.7 MB</div>
                <span class="asset-type">Image</span>
                 <a href="cookie.png" download>Download cookie.png</a>
            </div>
        </div>
    </div>
    
    <p><small>Last updated: October 15, 2026</small></p>
</body>
</html>
